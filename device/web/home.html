<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F3F5F2;      /* a wall by the window in daylight */
  --card: #FFFFFF;
  --ink: #1F2D36;        /* main text: blue-grey ink */
  --muted: #66767D;
  --line: #D9DFDB;
  --lamp: #F0B429;       /* where the camera is looking: a patch lit by a desk lamp */
  --ok: #2F8A68;
  --alert: #C8414F;
  --unsure: #B7791F;
  --ui: "Figtree", system-ui, sans-serif;
  --note: "Newsreader", Georgia, serif;   /* answers read like a note left on the kitchen table */
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--paper); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.6 var(--ui); -webkit-font-smoothing: antialiased; }
.app { max-width: 480px; margin: 0 auto; padding: 0 16px calc(170px + env(safe-area-inset-bottom)); }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
.empty { color: var(--muted); font-size: 15px; }

/* 頂部 */
.top { display: flex; align-items: flex-end; justify-content: space-between; padding: 22px 2px 14px; }
.top h1 { margin: 0; font: 600 30px/1.1 var(--note); letter-spacing: -.01em; }
.status { margin: 4px 0 0; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status[data-ok="1"]::before { background: var(--ok); }
.switch { font-size: 14px; color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }

/* 即時畫面 */
.live { position: relative; border-radius: 18px; overflow: hidden; background: #2a3238; aspect-ratio: 16 / 9; }
.live img { width: 100%; height: 100%; object-fit: cover; display: block; }
.live-tag { position: absolute; left: 12px; bottom: 12px; background: rgba(31,45,54,.78); color: #fff; font-size: 14px;
  padding: 4px 12px 4px 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px; }
.live-tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--lamp); }

/* 全景地圖 */
h2 { font: 600 21px/1.3 var(--note); margin: 26px 2px 2px; }
.hint { margin: 0 2px 10px; font-size: 14px; color: var(--muted); }
.map-scroll { overflow-x: auto; border-radius: 14px; scrollbar-width: thin; }
.map { position: relative; width: max(100%, 640px); overflow: hidden; border-radius: 14px; background: #2a3238; }
.map img { display: block; width: 100%; }
.beam { position: absolute; border: 2px solid var(--lamp); border-radius: 6px; pointer-events: none;
  box-shadow: 0 0 0 9999px rgba(31,45,54,.55), 0 0 24px 4px rgba(240,180,41,.45);
  transition: left .7s ease, top .7s ease; }
.pin { position: absolute; transform: translate(-50%, -50%); background: none; border: 0; padding: 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pin-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--card); border: 3px solid var(--lamp); box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.pin-label { background: var(--card); color: var(--ink); font-size: 13px; font-weight: 500; padding: 1px 8px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0,0,0,.25); white-space: nowrap; }
.pin:hover .pin-dot { background: var(--lamp); }
.pin.up { flex-direction: column-reverse; transform: translate(-50%, calc(-100% + 13px)); }

/* 這一題 */
.thread { margin-top: 24px; background: var(--card); border-radius: 18px; padding: 18px 18px 14px; }
.q { margin: 0; font-weight: 500; display: flex; gap: 8px; align-items: baseline; }
.via { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
.steps { list-style: none; margin: 10px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); font-size: 13px; color: var(--muted); }
.steps li { position: relative; padding: 2px 0; }
.steps li.now { color: var(--ink); }
.steps li.now::before { content: ""; position: absolute; left: -20px; top: 9px; width: 10px; height: 10px; border-radius: 50%; background: var(--lamp); animation: breathe 1.2s ease-in-out infinite; }
.step-t { font-variant-numeric: tabular-nums; margin-right: 8px; opacity: .7; }
.answer-text { margin: 14px 0 0; font: italic 400 23px/1.5 var(--note); }
.answer-text[data-found="0"] { color: var(--alert); }
.answer-meta { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.shots { display: flex; gap: 8px; margin-top: 12px; }
.shots img { height: 92px; border-radius: 10px; display: block; }
body.is-asking .thread { box-shadow: 0 0 0 2px var(--lamp); }

/* 最後一次確認 */
.checks { list-style: none; margin: 8px 0 0; padding: 0; }
.check { display: flex; gap: 12px; justify-content: space-between; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--line); }
.check-main { min-width: 0; display: flex; flex-direction: column; }
.check-name { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.check-name::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.check[data-state="ok"] .check-name::before { background: var(--ok); }
.check[data-state="unsure"] .check-name::before { background: var(--unsure); }
.check[data-state="alert"] .check-name::before { background: var(--alert); }
.check-ans { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.check-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.check-time { font-size: 12px; color: var(--muted); }
.check-go { background: none; border: 1px solid var(--ink); border-radius: 999px; padding: 3px 14px; font-size: 14px; }
.check-missing { font-size: 13px; color: var(--muted); padding: 10px 2px; }

.foot { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; font-size: 13px; color: var(--muted); }
.foot button { background: none; border: 0; color: var(--muted); padding: 0; text-decoration: underline; }

/* 底部提問列 */
.dock { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(243,245,242,.96); backdrop-filter: blur(8px);
  border-top: 1px solid var(--line); padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); }
.dock-in { max-width: 480px; margin: 0 auto; }
.quick { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.chip { flex: none; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: 14px; }
.mic-hint { margin: 0 0 8px; font-size: 14px; color: var(--ink); }
.row { display: flex; gap: 10px; align-items: center; }
.mic { flex: none; width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; display: grid; place-items: center; position: relative; }
.mic[data-ready="0"] { opacity: .55; }
.mic.recording { background: var(--alert); }
.mic.recording::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--alert); animation: ring 1.2s ease-out infinite; }
.q-input { flex: 1; min-width: 0; height: 46px; border: 1px solid var(--line); border-radius: 999px; padding: 0 18px; font: inherit; background: var(--card); color: var(--ink); }
.send { flex: none; height: 46px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--lamp); color: var(--ink); font-weight: 700; }
body.is-asking .send, body.is-asking .chip { opacity: .5; pointer-events: none; }

@keyframes breathe { 50% { opacity: .35; } }
@keyframes ring { from { opacity: .9; transform: scale(.9); } to { opacity: 0; transform: scale(1.3); } }
@media (prefers-reduced-motion: reduce) {
  .beam { transition: none; }
  .steps li.now::before, .mic.recording::after { animation: none; }
}
</style>
</head>
<body data-mode="home">
<div class="app">
  <header class="top">
    <div>
      <h1>Living room</h1>
      <p id="status" class="status">Connecting</p>
    </div>
    <a class="switch" href="/factory">Factory edition</a>
  </header>

  <div class="live">
    <img id="live" alt="Live view of the living room">
    <span id="liveTag" class="live-tag" hidden></span>
  </div>

  <h2>The whole room</h2>
  <p class="hint">Tap an item and the camera turns to it. The lit frame is where the camera is looking now.</p>
  <div id="mapScroll" class="map-scroll">
    <div id="map" class="map">
      <img id="panoImg" alt="Panorama of the living room">
      <div id="beam" class="beam" hidden></div>
      <div id="pins"></div>
    </div>
  </div>

  <section id="thread" class="thread" hidden aria-live="polite">
    <p class="q"><span id="question"></span><span id="viaVoice" class="via" hidden>spoken</span></p>
    <ol id="steps" class="steps"></ol>
    <div id="answer"></div>
    <div id="shots" class="shots"></div>
  </section>

  <h2>Last checked</h2>
  <ul id="checks" class="checks"></ul>

  <div class="foot">
    <button id="speak" type="button" aria-pressed="false">Read answers aloud: off</button>
    <a href="/dev">Developer tools</a>
  </div>
</div>

<form id="askForm" class="dock">
  <div class="dock-in">
    <div id="quick" class="quick"></div>
    <p id="micHint" class="mic-hint" hidden></p>
    <div class="row">
      <button type="button" id="mic" class="mic" aria-label="Ask by voice">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <input id="q" class="q-input" placeholder="Ask about home…" autocomplete="off" aria-label="Your question">
      <button class="send">Ask</button>
    </div>
  </div>
</form>
<script src="/web/app.js"></script>
</body>
</html>

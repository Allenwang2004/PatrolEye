<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PatrolEye bench · station</title>
<link rel="stylesheet" href="/fonts.css">
<style>
html,body{margin:0;height:100%;background:#C9CED2;overflow:hidden;cursor:none}
svg{display:block;width:100vw;height:100vh}
#hint{position:fixed;right:12px;bottom:10px;font:14px system-ui;color:#0006}
</style></head>
<body>
<svg id="s" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet"></svg>
<div id="hint">double-click: full screen</div>
<script>
const ID = +(location.pathname.split('/').pop() || new URLSearchParams(location.search).get('id') || 1);
const svg = document.getElementById('s');
const NS = 'http://www.w3.org/2000/svg';
document.title = `PatrolEye bench · station ${ID}`;
document.ondblclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
setTimeout(() => (document.getElementById('hint').style.display = 'none'), 6000);

const el = (tag, attrs = {}, parent = svg, text) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  parent.appendChild(e);
  return e;
};
const g = (parent = svg, attrs = {}) => el('g', attrs, parent);
const F = 'Barlow, "Helvetica Neue", Arial, sans-serif';

// ---------- shared scenery ----------
function wall(title) {
  const defs = el('defs');
  defs.innerHTML = `
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9B0B5"/><stop offset=".5" stop-color="#D8DDE0"/><stop offset="1" stop-color="#8E959A"/></linearGradient>
    <linearGradient id="steelV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8E959A"/><stop offset=".5" stop-color="#D8DDE0"/><stop offset="1" stop-color="#8E959A"/></linearGradient>
    <radialGradient id="face" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECEBE4"/></radialGradient>
    <radialGradient id="glassG" cx=".35" cy=".25" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="greenOn" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#C9FFD8"/><stop offset=".45" stop-color="#2ED26A"/><stop offset="1" stop-color="#108A3E"/></radialGradient>
    <radialGradient id="redOn" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#FFD0C8"/><stop offset=".45" stop-color="#FF3B2B"/><stop offset="1" stop-color="#A3140C"/></radialGradient>
    <radialGradient id="lampOff" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#7C8287"/><stop offset="1" stop-color="#3E4347"/></radialGradient>
    <radialGradient id="water" cx=".45" cy=".4" r=".6"><stop offset="0" stop-color="#9FC3D9" stop-opacity=".95"/><stop offset=".6" stop-color="#4F7891" stop-opacity=".9"/><stop offset="1" stop-color="#3B5D73" stop-opacity=".85"/></radialGradient>
    <pattern id="hatch" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="28" fill="#F2C230"/><rect x="14" width="14" height="28" fill="#1F2427"/></pattern>`;
  el('rect', {width: 1920, height: 1080, fill: '#C9CED2'});
  for (let x = 320; x < 1920; x += 320) el('line', {x1: x, y1: 0, x2: x, y2: 1080, stroke: '#BBC1C5', 'stroke-width': 3});
  el('text', {x: 48, y: 64, 'font-family': F, 'font-size': 34, 'font-weight': 600, fill: '#5B6770', 'letter-spacing': 4}, svg, title);
}
function plate(parent, x, y, w, tag, label, sub) {
  const p = g(parent);
  el('rect', {x: x - w / 2, y, width: w, height: sub ? 132 : 104, rx: 10, fill: '#F4F1E6', stroke: '#2B2F33', 'stroke-width': 4}, p);
  el('text', {x, y: y + 58, 'text-anchor': 'middle', 'font-family': F, 'font-size': 56, 'font-weight': 700, fill: '#1A1E21', 'letter-spacing': 2}, p, tag);
  el('text', {x, y: y + 92, 'text-anchor': 'middle', 'font-family': F, 'font-size': 26, 'font-weight': 600, fill: '#3E4A53', 'letter-spacing': 3}, p, label.toUpperCase());
  if (sub) el('text', {x, y: y + 122, 'text-anchor': 'middle', 'font-family': F, 'font-size': 24, 'font-weight': 600, fill: '#B4460C', 'letter-spacing': 2}, p, sub.toUpperCase());
  for (const sx of [x - w / 2 + 16, x + w / 2 - 16]) el('circle', {cx: sx, cy: y + 16, r: 5, fill: '#8E959A'}, p);
}
function pipeH(x1, x2, y, r = 34) {
  el('rect', {x: x1, y: y - r, width: x2 - x1, height: 2 * r, fill: 'url(#steel)'});
  el('line', {x1, y1: y - r, x2, y2: y - r, stroke: '#6E767C', 'stroke-width': 2});
  el('line', {x1, y1: y + r, x2, y2: y + r, stroke: '#6E767C', 'stroke-width': 2});
}

// ---------- station 1: two pressure gauges ----------
const gauges = {};
function gauge(tag, cx, cy, R, eq) {
  const G = g();
  const max = eq.max, lim = eq.limit;
  const ang = (v) => (135 + (270 * v) / max) * Math.PI / 180;
  const pt = (v, r) => [cx + r * Math.cos(ang(v)), cy + r * Math.sin(ang(v))];
  // stem down to the pipe
  el('rect', {x: cx - 26, y: cy + R - 10, width: 52, height: 1000 - cy - R, fill: 'url(#steelV)'}, G);
  el('rect', {x: cx - 46, y: cy + R + 6, width: 92, height: 40, rx: 6, fill: '#7E868B'}, G);
  el('circle', {cx, cy, r: R, fill: '#2E3438'}, G);
  el('circle', {cx, cy, r: R - 8, fill: '#5A6268'}, G);
  el('circle', {cx, cy, r: R - 24, fill: 'url(#face)'}, G);
  const rf = R - 46;
  // red band from the limit to full scale
  const [ax, ay] = pt(lim, rf - 8), [bx, by] = pt(max, rf - 8);
  const large = (270 * (max - lim)) / max > 180 ? 1 : 0;
  el('path', {d: `M${ax} ${ay} A${rf - 8} ${rf - 8} 0 ${large} 1 ${bx} ${by}`, fill: 'none', stroke: '#D12F2F', 'stroke-width': 18}, G);
  for (let i = 0; i <= max * 5; i++) {
    const v = i / 5, major = i % 5 === 0;
    const [x1, y1] = pt(v, rf), [x2, y2] = pt(v, rf - (major ? 40 : 20));
    el('line', {x1, y1, x2, y2, stroke: '#16191B', 'stroke-width': major ? 7 : 3, 'stroke-linecap': 'butt'}, G);
    if (major) {
      const [tx, ty] = pt(v, rf - 72);
      el('text', {x: tx, y: ty + 17, 'text-anchor': 'middle', 'font-family': F, 'font-size': 50, 'font-weight': 700, fill: '#16191B'}, G, String(v));
    }
  }
  el('text', {x: cx, y: cy + rf * 0.62, 'text-anchor': 'middle', 'font-family': F, 'font-size': 44, 'font-weight': 600, fill: '#3E4A53'}, G, 'bar');
  el('text', {x: cx, y: cy + rf * 0.36, 'text-anchor': 'middle', 'font-family': F, 'font-size': 28, 'font-weight': 600, fill: '#7A848B', 'letter-spacing': 3}, G, tag);
  const needle = g(G);
  el('path', {d: `M${cx - 9} ${cy + 46} L${cx - 3.5} ${cy - (rf - 26)} L${cx + 3.5} ${cy - (rf - 26)} L${cx + 9} ${cy + 46} Z`, fill: '#141618'}, needle);
  el('circle', {cx, cy, r: 26, fill: '#2B2F33'}, G);
  el('circle', {cx, cy, r: 10, fill: '#8E959A'}, G);
  el('circle', {cx, cy, r: R - 24, fill: 'url(#glassG)'}, G);
  gauges[tag] = {needle, cx, cy, max, shown: eq.value};
}
function setNeedle(tag, v) {
  const n = gauges[tag];
  const deg = -135 + (270 * v) / n.max;   // needle drawn pointing up = 0
  n.needle.setAttribute('transform', `rotate(${deg} ${n.cx} ${n.cy})`);
}

// ---------- station 2: valve + breaker panel ----------
let valveSeen = null, valveSwing = 0;
let valveLever, valveFlag, valveFlagText, breakerHandle, breakerFlag, breakerText;
function station2(eq) {
  wall('STATION 2 · PUMP ROOM B');
  // valve on a pipe
  pipeH(0, 960, 560);
  for (const x of [330, 650]) el('rect', {x: x - 22, y: 470, width: 44, height: 180, rx: 6, fill: '#7E868B'});
  el('rect', {x: 352, y: 470, width: 276, height: 180, rx: 40, fill: '#6F777C'});
  el('rect', {x: 372, y: 488, width: 236, height: 144, rx: 34, fill: '#8C9398'});
  el('rect', {x: 470, y: 390, width: 40, height: 92, fill: '#5A6268'});
  el('text', {x: 140, y: 470, 'font-family': F, 'font-size': 34, 'font-weight': 700, fill: '#3E4A53', 'letter-spacing': 3}, svg, 'FLOW →');
  valveLever = g(svg);
  el('rect', {x: 490, y: 372, width: 270, height: 44, rx: 18, fill: '#E0A800', stroke: '#8A6700', 'stroke-width': 3}, valveLever);
  el('circle', {cx: 490, cy: 394, r: 40, fill: '#3E4347'}, valveLever);
  el('circle', {cx: 490, cy: 394, r: 14, fill: '#9AA1A6'}, valveLever);
  // position indicator next to the stem
  valveFlag = el('rect', {x: 640, y: 258, width: 200, height: 76, rx: 10, fill: '#1E8E5A'});
  valveFlagText = el('text', {x: 740, y: 312, 'text-anchor': 'middle', 'font-family': F, 'font-size': 44, 'font-weight': 700, fill: '#fff', 'letter-spacing': 4}, svg, 'OPEN');
  plate(svg, 490, 720, 560, 'V-12', 'Cooling water inlet', 'Normally open');

  // breaker panel
  el('rect', {x: 1050, y: 150, width: 800, height: 760, rx: 16, fill: '#7F878C'});
  el('rect', {x: 1076, y: 176, width: 748, height: 708, rx: 10, fill: '#E6E8E9'});
  el('text', {x: 1450, y: 250, 'text-anchor': 'middle', 'font-family': F, 'font-size': 60, 'font-weight': 700, fill: '#1A1E21', 'letter-spacing': 3}, svg, 'DB-1');
  el('text', {x: 1450, y: 292, 'text-anchor': 'middle', 'font-family': F, 'font-size': 26, 'font-weight': 600, fill: '#3E4A53', 'letter-spacing': 3}, svg, 'PUMP ROOM PANEL');
  el('rect', {x: 1110, y: 330, width: 680, height: 30, fill: '#B9BEC1'});
  const loads = ['LIGHTING', 'P-3 PUMP', 'VENT FAN', 'SOCKETS'];
  for (let i = 0; i < 4; i++) {
    const x = 1140 + i * 170;
    el('rect', {x, y: 380, width: 130, height: 330, rx: 10, fill: '#2B2F33'});
    el('rect', {x: x + 25, y: 430, width: 80, height: 200, rx: 8, fill: '#15181A'});
    el('text', {x: x + 65, y: 750, 'text-anchor': 'middle', 'font-family': F, 'font-size': 40, 'font-weight': 700, fill: '#1A1E21'}, svg, `CB-${i + 1}`);
    el('text', {x: x + 65, y: 786, 'text-anchor': 'middle', 'font-family': F, 'font-size': 22, 'font-weight': 600, fill: '#5B6770', 'letter-spacing': 1}, svg, loads[i]);
    if (i === 2) {
      breakerHandle = el('rect', {x: x + 33, y: 440, width: 64, height: 90, rx: 8, fill: '#F2F4F5'});
      breakerFlag = el('rect', {x: x + 33, y: 640, width: 64, height: 26, rx: 4, fill: '#2B2F33'});
      breakerText = el('text', {x: x + 65, y: 412, 'text-anchor': 'middle', 'font-family': F, 'font-size': 28, 'font-weight': 700, fill: '#2ED26A'}, svg, 'ON');
    } else {
      el('rect', {x: x + 33, y: 440, width: 64, height: 90, rx: 8, fill: '#F2F4F5'});
      el('text', {x: x + 65, y: 412, 'text-anchor': 'middle', 'font-family': F, 'font-size': 28, 'font-weight': 700, fill: '#2ED26A'}, svg, 'ON');
    }
  }
  el('text', {x: 1450, y: 850, 'text-anchor': 'middle', 'font-family': F, 'font-size': 26, 'font-weight': 600, fill: '#B4460C', 'letter-spacing': 2}, svg, 'ALL BREAKERS NORMALLY ON');
}
function drawStation2(eq, t) {
  const closed = eq['V-12'].state === 'closed';
  // swing the lever only when its state changes while this page is open
  if (valveSeen === null) valveSeen = closed;
  if (closed !== valveSeen) { valveSeen = closed; valveSwing = performance.now(); }
  const k = valveSwing ? Math.min(1, (performance.now() - valveSwing) / 800) : 1;
  const a = closed ? -90 * k : -90 * (1 - k);
  valveLever.setAttribute('transform', `rotate(${a} 490 394)`);
  valveFlag.setAttribute('fill', closed ? '#D12F2F' : '#1E8E5A');
  valveFlagText.textContent = closed ? 'SHUT' : 'OPEN';
  const trip = eq['DB-1'].state === 'tripped';
  breakerHandle.setAttribute('y', trip ? 520 : 440);
  breakerFlag.setAttribute('fill', trip ? '#FF6B1A' : '#2B2F33');
  breakerText.textContent = trip ? 'TRIP' : 'ON';
  breakerText.setAttribute('fill', trip ? '#D12F2F' : '#2ED26A');
}

// ---------- station 3: pump P-3 and the floor under it ----------
let lampRun, lampFault, puddle, puddle2, drips = [];
function station3() {
  wall('STATION 3 · PUMP ROOM B');
  el('rect', {x: 0, y: 760, width: 1920, height: 320, fill: '#AEB4B8'});
  el('rect', {x: 0, y: 760, width: 1920, height: 8, fill: '#969DA1'});
  el('rect', {x: 260, y: 1000, width: 1400, height: 26, fill: 'url(#hatch)'});
  el('text', {x: 1690, y: 1060, 'text-anchor': 'end', 'font-family': F, 'font-size': 30, 'font-weight': 700, fill: '#5B6770', 'letter-spacing': 4}, svg, 'ZONE 3 FLOOR');
  // pipes behind everything
  el('rect', {x: 920, y: 120, width: 60, height: 360, fill: 'url(#steelV)'});
  pipeH(950, 1920, 120, 30);
  el('rect', {x: 1160, y: 570, width: 60, height: 190, fill: 'url(#steelV)'});
  pipeH(1100, 1190, 600, 30);
  // control box with lamps, on a post
  el('rect', {x: 1563, y: 520, width: 14, height: 240, fill: '#5A6268'});
  el('rect', {x: 1340, y: 190, width: 460, height: 340, rx: 14, fill: '#D9DCDE', stroke: '#7F878C', 'stroke-width': 6});
  el('text', {x: 1570, y: 250, 'text-anchor': 'middle', 'font-family': F, 'font-size': 34, 'font-weight': 700, fill: '#1A1E21', 'letter-spacing': 3}, svg, 'P-3 CONTROL');
  el('circle', {cx: 1460, cy: 365, r: 78, fill: '#4B5156'});
  el('circle', {cx: 1680, cy: 365, r: 78, fill: '#4B5156'});
  lampRun = el('circle', {cx: 1460, cy: 365, r: 62, fill: 'url(#greenOn)'});
  lampFault = el('circle', {cx: 1680, cy: 365, r: 62, fill: 'url(#lampOff)'});
  el('text', {x: 1460, y: 500, 'text-anchor': 'middle', 'font-family': F, 'font-size': 38, 'font-weight': 700, fill: '#1A1E21', 'letter-spacing': 3}, svg, 'RUN');
  el('text', {x: 1680, y: 500, 'text-anchor': 'middle', 'font-family': F, 'font-size': 38, 'font-weight': 700, fill: '#1A1E21', 'letter-spacing': 3}, svg, 'FAULT');
  // puddle (under everything else on the floor)
  puddle = el('ellipse', {cx: 760, cy: 900, rx: 0, ry: 0, fill: 'url(#water)'});
  puddle2 = el('ellipse', {cx: 640, cy: 930, rx: 0, ry: 0, fill: 'url(#water)'});
  // pump skid, motor, volute
  el('rect', {x: 220, y: 720, width: 980, height: 70, rx: 8, fill: '#3F5F7A'});
  el('rect', {x: 300, y: 470, width: 470, height: 250, rx: 30, fill: '#2F6F9F'});
  for (let x = 330; x < 760; x += 36) el('rect', {x, y: 482, width: 14, height: 226, rx: 6, fill: '#2A6290'});
  el('rect', {x: 250, y: 520, width: 60, height: 150, rx: 12, fill: '#285A82'});
  el('rect', {x: 770, y: 560, width: 70, height: 70, fill: '#8E959A'});
  el('circle', {cx: 950, cy: 600, r: 150, fill: '#3B7FB0'});
  el('circle', {cx: 950, cy: 600, r: 106, fill: '#337199'});
  el('rect', {x: 1080, y: 556, width: 30, height: 88, fill: '#7E868B'});
  el('rect', {x: 900, y: 440, width: 100, height: 26, fill: '#7E868B'});
  plate(svg, 535, 210, 420, 'P-3', 'Cooling water pump');
  // drips from the flange
  for (let i = 0; i < 3; i++) drips.push(el('ellipse', {cx: 1095, cy: 650, rx: 7, ry: 11, fill: '#5B87A3', opacity: 0}));
}
function drawStation3(eq, t) {
  const fault = eq['P-3'].state === 'fault';
  lampRun.setAttribute('fill', fault ? 'url(#lampOff)' : 'url(#greenOn)');
  const blink = Math.floor(t * 2) % 2 === 0;
  lampFault.setAttribute('fill', fault && blink ? 'url(#redOn)' : 'url(#lampOff)');
  const leak = eq['FLOOR-3'];
  const s = leak.state === 'leak' ? Math.min(1, (leak.since || 0) / 12) : 0;
  puddle.setAttribute('rx', 340 * Math.sqrt(s)); puddle.setAttribute('ry', 70 * Math.sqrt(s));
  puddle.setAttribute('cx', 1000 - 120 * s);
  puddle2.setAttribute('rx', 200 * Math.max(0, s - 0.3)); puddle2.setAttribute('ry', 40 * Math.max(0, s - 0.3));
  drips.forEach((d, i) => {
    if (leak.state !== 'leak') { d.setAttribute('opacity', 0); return; }
    const ph = ((t * 0.9 + i / 3) % 1);
    d.setAttribute('cy', 650 + ph * 230); d.setAttribute('opacity', ph < 0.92 ? 0.9 : 0);
  });
}

// ---------- run ----------
let eq = null, synced = 0, built = false, clockOff = 0;
async function poll() {
  try {
    const r = await fetch('/api/state?view=station', {cache: 'no-store'});
    const d = await r.json();
    clockOff = d.now - Date.now() / 1000;
    eq = d.eq; synced = performance.now();
    if (!built) build();
  } catch (e) { /* bench restarting: keep the last picture */ }
  setTimeout(poll, 250);
}
function build() {
  built = true;
  svg.innerHTML = '';
  if (ID === 1) {
    wall('STATION 1 · PUMP ROOM B');
    pipeH(0, 1920, 990, 40);
    gauge('PT-101', 540, 440, 300, eq['PT-101']);
    gauge('PT-102', 1380, 440, 300, eq['PT-102']);
    plate(svg, 540, 770, 420, 'PT-101', 'Header pressure', 'Limit 6.0 bar');
    plate(svg, 1380, 770, 420, 'PT-102', 'Pump discharge', 'Limit 6.0 bar');
  } else if (ID === 2) station2(eq);
  else station3(eq);
  requestAnimationFrame(frame);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const t = now / 1000;
  if (ID === 1) {
    for (const tag of ['PT-101', 'PT-102']) {
      const x = eq[tag], n = gauges[tag];
      if (Math.abs(n.shown - x.value) > 0.25) n.shown = x.value;     // resync if far off
      const d = x.target - n.shown, step = 0.5 * dt;
      n.shown += Math.abs(d) <= step ? d : Math.sign(d) * step;
      const jitter = 0.015 * Math.sin(t * 7.3 + (tag === 'PT-101' ? 0 : 2));
      setNeedle(tag, Math.max(0, n.shown + jitter));
    }
  } else if (ID === 2) {
    const age = (performance.now() - synced) / 1000;
    const e2 = {...eq, 'V-12': {...eq['V-12'], since: eq['V-12'].since + age}};
    drawStation2(e2, t);
  } else {
    const age = (performance.now() - synced) / 1000;
    drawStation3({...eq, 'FLOOR-3': {...eq['FLOOR-3'], since: eq['FLOOR-3'].since + age}}, t);
  }
  requestAnimationFrame(frame);
}
poll();
</script>
</body></html>
